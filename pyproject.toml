[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-ai-novelgenerator"
version = "1.0.0"
description = "Standalone CLI workflow harness for AI_NovelGenerator"
readme = "cli_anything/ai_novelgenerator/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "YILING0013" }
]
keywords = ["cli", "novel", "llm", "writing", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
]
dependencies = [
  "click>=8.1,<9",
  "langchain>=0.3,<0.4",
  "langchain-chroma>=0.2,<0.3",
  "langchain-openai>=0.3,<0.4",
  "openai>=1.0,<2",
  "google-genai>=1.0,<2",
  "azure-ai-inference>=1.0.0b9,<2",
  "azure-core>=1.35,<2",
  "nltk>=3.9,<4",
  "numpy>=2,<3",
  "requests>=2.31,<3",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
cli-anything-ai-novelgenerator = "cli_anything.ai_novelgenerator.ai_novelgenerator_cli:main"

[project.urls]
Homepage = "https://github.com/YILING0013/cli-anything-ai-novelgenerator"
Repository = "https://github.com/YILING0013/cli-anything-ai-novelgenerator"
Issues = "https://github.com/YILING0013/cli-anything-ai-novelgenerator/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cli_anything.*"]

[tool.setuptools.package-data]
"cli_anything.ai_novelgenerator" = ["skills/*.md", "backend/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["cli_anything/ai_novelgenerator/tests"]
addopts = "-v --tb=no"
